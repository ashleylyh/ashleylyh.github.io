PROJECTS:
  - title: "Developing an AI System for Smart Traffic: From Vehicle Detection to Data Analytics Dashboard"
    category: "AI & ML"
    image: "src/images/fyp.jpg"
    url: ""
    report_url: ""
    detail: |
      Description:
      Final Year Project focused on developing an end-to-end AI solution for real-time traffic monitoring and analytics. The system integrates deep learning–based vehicle detection with multi-object tracking, and an interactive analytics dashboard to deliver actionable insights for urban traffic management in Hong Kong. 
      In collaboration with K11 MUSEA, traffic cameras along Salisbury Road (eastbound and westbound) were analyzed to study flow patterns, providing mall management with data-driven insights to optimize vehicle routing and improve traffic efficiency around the mall.

      Key Technology & Contributions:
      - Fine-tuned YOLOv11 with public available dataset and self-labeled dataset for robust vehicle detection under diverse traffic and weather conditions, improving detection performance in complex Hong Kong road scenarios.
      
      - Integrated ByteTrack for precise multi-object tracking, enabling extraction of key traffic metrics (e.g. vehicle count, speed, flowrate, ...) with high tracking consistency.
      
      - Developed a real-time dashboard with Streamlit, powered by FastAPI and Redis Database, to visualize live traffic data and trends for stakeholders.

      Keywords:
      Python, PyTorch, YOLO11, ByteTrack, Redis, FastAPI, Streamlit, Computer Vision, Real-Time Analytics, Smart Traffic
    
  - title: "Deepfake image classification"
    category: "AI & ML"
    image: "src/images/comp4471.png"
    url: ""
    report_url: ""
    detail: |
      Description: 
      Research project in the Deep Learning in Computer Vision (DLCV) course focused on distinguishing real images from AI-generated ones. The study benchmarked multiple CNN and Transformer-based architectures on the CiFAKE dataset and investigated image forensics techniques -- ELA to evaluate their effectiveness in detecting synthetic content.

      Key Technology & Contributions:
      - Benchmarked CNN architectures (VGG16, ResNet50, MobileNet, EfficientNet), achieving up to 98% accuracy, with EfficientNet identified as the most effective.
      
      - Evaluated Vision Transformers (ViT), achieving the highest recall (0.9917) compared to previous CNN-based models.
      
      - Explored Error Level Analysis (ELA) with lightweight models, observing a 13% accuracy drop, highlighting the trade-off between model size and image preprocessing technique's effect on detection capability.

      Keywords:
      Python, PyTorch, CiFAKE dataset, CNN (VGG16, ResNet50, MobileNet, EfficientNet), Vision Transformer (ViT), Error Level Analysis (ELA), Deepfake Detection, Image Processing

  - title: "Hong Kong Horse Racing Prediction"
    category: "AI & ML"
    image: "src/images/comp4211_project.jpg"
    url: ""
    report_url: ""
    detail: |
      Description:
      Project in the Machine Learning course focused on predicting horse race outcomes as a pointwise Learning-to-Rank problem, with emphasis on the top four finishing positions to align with common betting strategies.

      Key Technology & Contributions:
      - Conducted race-level features engineering (jockey/horse performance, track condition, race distance), improving the model’s ability to capture performance factors and enhance ranking precision.
      
      - Implemented supervised regression models (Linear Regression, MLP, Random Forest), with the MLP achieving the highest top-4 prediction accuracy.
      
      - Applied a Learning-to-Rank framework to transform MLP outputs into ordered race predictions, improving ranking consistency and enabling practical betting strategy simulations.

      Keywords:
      Python, Pandas, NumPy, Scikit-learn, TensorFlow, Linear Regression, Random Forest, Multilayer Perceptron (MLP), Learning-to-Rank (LTR), Feature Engineering

