HEADER:
  label: "About me"

PRESENTATION:
  description: |
    I'm a Software Engineer from Taiwan, passionate about Computer Vision, Machine Learning, and Visual related Technologies. With solid experience in machine learning, software systems development, and full-stack web applications.
    
    I recently graduated from The Hong Kong University of Science and Technology with a BEng in Computer Engineering and a minor in Big Data Technology. 
    Currently, I work as a Research Assistant at Academia Sinica in Institution of Statistics, where I contribute to cutting-edge research projects in Smart Health Project and AI-driven analytics.  

    Feel free to connect and get in touch with me :)

