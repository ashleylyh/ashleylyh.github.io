      description: "Investigating state-of-the-art NLP and deep learning architectures—including transformer-based models—for practical applications."
    - title: "Computer Architecture"
      icon: "terminal"
      description: "Optimizing GPU-accelerated parallel-compute frameworks and exploring hardware-software co-design for high-performance systems."
